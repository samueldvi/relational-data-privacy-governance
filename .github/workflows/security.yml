name: Security

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pip-audit==2.9.0 cyclonedx-bom==7.1.0
      - name: Audit dependencies and retain all findings
        continue-on-error: true
        run: pip-audit --requirement requirements-runtime.txt --format json --output pip-audit.json
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements-runtime.txt --output-file sbom.json
      - run: python scripts/check_repository_safety.py
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-security-reports
          path: |
            pip-audit.json
            sbom.json
          retention-days: 14

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag privacy-pipeline:security .
      - name: Scan fixable critical and high vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: privacy-pipeline:security
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
