name: Manual benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: privacy_benchmark_ci
      POSTGRES_USER: privacy_benchmark_ci
      POSTGRES_PASSWORD: ci-only-synthetic-benchmark-password-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      MASKING_SECRET: ci-only-synthetic-benchmark-masking-secret-not-for-production-20260805
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: privacy_benchmark_ci
          POSTGRES_USER: privacy_benchmark_ci
          POSTGRES_PASSWORD: ci-only-synthetic-benchmark-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacy_benchmark_ci -d privacy_benchmark_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Initialize database
        run: |
          for sql_file in $(find sql -maxdepth 1 -type f -name '*.sql' | sort); do
            PGPASSWORD="$POSTGRES_PASSWORD" psql --host "$POSTGRES_HOST" --port "$POSTGRES_PORT" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 --file "$sql_file"
          done
      - name: Run all synthetic benchmark profiles
        run: python benchmarks/run_pipeline_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            output/benchmark_results.json
            docs/PERFORMANCE_BASELINE.md
          retention-days: 14
