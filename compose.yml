services:
  postgres:
    image: postgres:16-alpine
    container_name: relational-data-privacy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  privacy-pipeline:
    image: relational-data-privacy-governance:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    read_only: true
    user: "10001:10001"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MASKING_SECRET: ${MASKING_SECRET}

    depends_on:
      postgres:
        condition: service_healthy

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    volumes:
      - pipeline_output:/app/output
      - /app/config
      - /app/docs

volumes:
  postgres_data:
  pipeline_output:
